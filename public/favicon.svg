<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32">
  <!-- 배경 원 -->
  <rect width="32" height="32" rx="8" fill="#0D9488"/>

  <!-- 알약 (캡슐) 모양: 가로 방향, 중앙 배치 -->
  <!-- 전체 캡슐 외형 클리핑 -->
  <clipPath id="pill-clip">
    <rect x="5" y="11" width="22" height="10" rx="5"/>
  </clipPath>

  <!-- 좌측 절반 (불투명 흰색) -->
  <rect x="5" y="11" width="11" height="10" fill="white" clip-path="url(#pill-clip)"/>

  <!-- 우측 절반 (반투명 흰색) -->
  <rect x="16" y="11" width="11" height="10" fill="rgba(255,255,255,0.45)" clip-path="url(#pill-clip)"/>

  <!-- 중간 구분선 -->
  <line x1="16" y1="11" x2="16" y2="21" stroke="#0D9488" stroke-width="1.2"/>

  <!-- 캡슐 테두리 -->
  <rect x="5" y="11" width="22" height="10" rx="5" fill="none" stroke="rgba(255,255,255,0.6)" stroke-width="0.8"/>
</svg>
